spring.application.name=product-management-test

# Datasource (H2 in-memory test db)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT
jwt.secret=9a67279f10b32531a3e205f1299c0a481c1ae04c3519db83042183223a91932341f043e25a4741c5c9fa459f3abff9f7f5e57a5d738125431e477436d009a610
jwt.expiration-ms=86400000

# Cache
spring.cache.type=caffeine
app.cache.caffeine.ttl-minutes=10
app.cache.caffeine.max-size=500
