<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(~{::title})}">
  <title>Products - Product Management</title>
</head>
<body>

  <!-- Navigation -->
  <div th:replace="~{layout/main :: navbar}"></div>

  <div class="container mb-5">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">Product List</h3>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Product</button>
    </div>

    <!-- Search & Filter Card -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="filterForm" class="row g-3" onsubmit="event.preventDefault(); loadProducts(0);">
          <div class="col-md-5">
            <label for="searchName" class="form-label">Search Name</label>
            <input type="text" class="form-control" id="searchName" placeholder="Product name...">
          </div>
          <div class="col-md-2">
            <label for="minPrice" class="form-label">Min Price</label>
            <input type="number" class="form-control" id="minPrice" placeholder="0" min="0" step="0.01">
          </div>
          <div class="col-md-2">
            <label for="maxPrice" class="form-label">Max Price</label>
            <input type="number" class="form-control" id="maxPrice" placeholder="1000" min="0" step="0.01">
          </div>
          <div class="col-md-3 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary w-50">Search</button>
            <button type="button" class="btn btn-outline-secondary w-50" onclick="resetSearch()">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Product Table Card -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th style="width: 70px;">ID</th>
              <th style="width: 250px;">Name</th>
              <th>Description</th>
              <th style="width: 140px;">Price</th>
              <th style="width: 140px;">Created</th>
              <th style="width: 140px;" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- Dynamic content loaded by app.js -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="card-footer d-flex justify-content-end bg-white py-2">
        <nav>
          <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>

  </div>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Product Form</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="productForm" onsubmit="saveProduct(event)">
          <input type="hidden" id="productId">
          <div class="modal-body">
            <div class="mb-3">
              <label for="productName" class="form-label">Name *</label>
              <input type="text" class="form-control" id="productName" required maxlength="100">
            </div>
            <div class="mb-3">
              <label for="productDescription" class="form-label">Description</label>
              <textarea class="form-control" id="productDescription" rows="3" maxlength="500"></textarea>
            </div>
            <div class="mb-3">
              <label for="productPrice" class="form-label">Price ($) *</label>
              <input type="number" class="form-control" id="productPrice" required min="0.01" step="0.01">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <p class="mb-3">Are you sure you want to delete <strong id="deleteItemName"></strong>?</p>
          <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" onclick="doDelete()">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{layout/main :: scripts}"></div>

  <script>
    function resetSearch() {
      document.getElementById('filterForm').reset();
      loadProducts(0);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!getToken()) {
        window.location.href = '/login';
        return;
      }
      const username = localStorage.getItem('username');
      const role = localStorage.getItem('role');
      if (username) {
        document.getElementById('userGreeting').textContent = `${username} (${role || 'USER'})`;
      }
      loadProducts(0);
    });
  </script>
</body>
</html>
